<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AfriBox</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct visit to e.g.
      // /afribox/pricing 404s. This re-encodes the path into a query string,
      // redirects to the SPA's index.html, and index.html's own inline script
      // restores the real URL before React Router ever sees it.
      var segmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
