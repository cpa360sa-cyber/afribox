<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AfriBox is a full-stack AI platform for South African startups — AI AdminBot, SalesBot and BrandBot, plus BrandBox, AiScan, Voice Command Center, Bookings & Payments, and more. Train your own AI employee." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>AfriBox — Train Your Own AI Employee</title>
    <script>
      // Restores the real path that public/404.html redirected here as a query string.
      ;(function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          var path = decoded.shift()
          var rest = decoded.join('&')
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + (path || '') + (rest ? '?' + rest : '') + l.hash
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
